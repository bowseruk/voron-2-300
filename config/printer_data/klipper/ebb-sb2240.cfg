#####################################################################
#   Introduction
#####################################################################

# This file has the connection to the Mellow Fly-SB2040 v2 Plus board.
# It also stores the alias information for it.

#####################################################################
#   MCU Information
#####################################################################

[mcu SB2240]
canbus_uuid: f69da94baa27 # The address for previous v1 board - 250b9e2b5694

#####################################################################
#   Mellow Fly-SB2040 V2 Plus Aliases
#####################################################################

[board_pins SB2240]
mcu: SB2240
aliases:
aliases_canbus:
    CANBUS_RX=PB0, CANBUS_TX=PB1
aliases_usb:
    USB_DP=PA12, USB_DN=PA11
aliases_spi:
    SPI_NSS=PA10, SPI_CLK=PB10, SPI_MOSI=PB11, SPI_IO1=PA9, SPI_IO2=PA8, SPI_MISO=PB2,
aliases_2240:
    EXT_EN=PD2,EXT_STEP=PD0,EXT_DIR=PD1,EXT_DIAG=PB3
    EXT_NSS=PA15 
aliases_endstop:
    STOP1=PB6,STOP2=PB5,STOP3=PB7
aliases_probe:
    PROXIMITY1=PC13, BLTOUCH_SERVOS=PB9, BLTOUCH_PROBE=PB8
aliases_cnc_fans:
    FAN1=PA0,FAN2=PA1,FAN3_TACH=PB15, FAN3_PWM=PB14
aliases_thermistors:
    TH0=PA3,TH1=PA4
aliases_heaters:
    HE0=PB13
aliases_rgb:
    RGBLED=PD3
aliases_adxl:
    ADXL=PB12

## ADXL345
[adxl345 sb2240]
cs_pin: SB2240:SPI_NSS
spi_software_sclk_pin: SB2240:SPI_CLK
spi_software_mosi_pin: SB2240:SPI_MOSI
spi_software_miso_pin: SB2240:SPI_MISO
axes_map: z,-y,x
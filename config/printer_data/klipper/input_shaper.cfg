#####################################################################
#   Introduction
#####################################################################

## This file is the configuration for input shaper and the adxl345.
## This is in the SB2240 board

#####################################################################
#                       adxl345
#####################################################################

[resonance_tester]
accel_per_hz: 75  # default is 75
probe_points: 100, 100, 20
accel_chip: adxl345 probe

#####################################################################
#   Input Shaper
#####################################################################

[input_shaper]
shaper_freq_x: 52.8
shaper_type_x: mzv
shaper_freq_y: 42.0
shaper_type_y: mzv


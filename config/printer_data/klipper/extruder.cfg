#####################################################################
#   Introduction
#####################################################################

## This file is the configuration for the extruder.
## It is a LDO G2E, with rapido pt1000 hotened on a EBB2240

#####################################################################
#   Extruder
#####################################################################

[extruder]
step_pin: SB2240:EXT_STEP
dir_pin: !SB2240:EXT_DIR
enable_pin: !SB2240:EXT_EN

rotation_distance: 47.088
gear_ratio: 9:1
microsteps: 16
full_steps_per_rotation: 200
max_extrude_only_distance: 1000.0
max_extrude_only_velocity: 60.0
max_extrude_only_accel: 1500
nozzle_diameter: 0.400
filament_diameter: 1.750

sensor_type:MAX31865
sensor_pin: SB2240: TH1
spi_bus: spi1
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2

heater_pin: SB2240:HE0
# sensor_pin: SB2040:TH0
# sensor_type: SliceEngineering 450  # Current thermistor
# PID tune results for Triangle lab 60 watt heater with slice engineering 450
# control = pid
# pid_kp = 20.914
# pid_ki = 1.064
# pid_kd = 102.741
min_temp: -50
max_temp: 350
min_extrude_temp: 150
step_pulse_duration: 0.000004
pressure_advance: 0.03     

# [tmc2209 extruder]
# uart_pin: SB2040:EXT_UART
# stealthchop_threshold: 0
# run_current: 0.30

[tmc2240 extruder]
cs_pin: SB2240: PA15
spi_software_sclk_pin: SB2240: SPI_CLK
spi_software_mosi_pin: SB2240: SPI_MOSI
spi_software_miso_pin: SB2240: SPI_MISO
driver_TPFD: 0
run_current: 0.6